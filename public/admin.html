<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orange May Admin</title>

  <style>
    * {
      box-sizing: border-box;
      min-width: 0;
    }

    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --orange: #ff6a00;
      --orange-soft: #ffefe3;
      --cream: #f5f0e8;
      --white: #ffffff;
      --black: #11100f;
      --grey: #77716a;
      --line: rgba(17, 16, 15, .14);
      --red: #b3261e;
      --green: #1d6f42;
    }

    html {
      scroll-behavior: smooth;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;

      width: 100%;
      max-width: 100%;

      overflow-x: hidden;

      background: var(--cream);
      color: var(--black);

      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(calc(100% - 56px), 1180px);

      margin: 0 auto;

      padding: 38px 0 90px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 28px;

      margin-bottom: 42px;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: var(--grey);

      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .16em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(3rem, 7vw, 5.6rem);
      line-height: .86;
      letter-spacing: -.06em;

      text-transform: uppercase;
    }

    h1 span {
      color: var(--orange);
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;

      gap: 10px;
    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .btn {
      min-height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 18px;

      border-radius: 999px;

      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .06em;
      line-height: 1;

      text-align: center;
      text-transform: uppercase;

      white-space: nowrap;

      cursor: pointer;

      transition:
        transform .18s ease,
        opacity .18s ease,
        background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      border: 0;

      background: var(--orange);
      color: white;
    }

    .btn-dark {
      border: 0;

      background: var(--black);
      color: white;
    }

    .btn-light {
      border: 1px solid var(--line);

      background: white;
      color: var(--black);
    }

    .btn-danger {
      border: 1px solid rgba(179,38,30,.35);

      background: transparent;
      color: var(--red);
    }

    .top-actions .btn {
      min-width: 120px;
    }


    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      width: 100%;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 14px;

      margin-bottom: 34px;
    }

    .stat-card {
      min-width: 0;

      padding: 22px;

      border: 1px solid var(--line);

      background: white;
    }

    .stat-label {
      color: var(--grey);

      font-size: .65rem;
      font-weight: 900;
      letter-spacing: .12em;

      text-transform: uppercase;
    }

    .stat-number {
      margin-top: 7px;

      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.04em;
    }


    /* =====================================================
       TOOLBAR
    ===================================================== */

    .toolbar {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 24px;
    }

    .tabs {
      display: inline-flex;

      max-width: 100%;

      padding: 4px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: white;
    }

    .tab {
      padding: 10px 15px;

      border: 0;
      border-radius: 999px;

      background: transparent;

      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .07em;

      text-transform: uppercase;
    }

    .tab.active {
      background: var(--black);
      color: white;
    }


    /* =====================================================
       PANEL
    ===================================================== */

    .panel {
      width: 100%;
      max-width: 100%;

      overflow: hidden;

      padding: 28px;

      margin-bottom: 34px;

      border: 1px solid var(--line);

      background: white;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 26px;
    }

    .panel-header h2 {
      margin: 0;

      font-size: 1.6rem;
      letter-spacing: -.03em;
    }

    .panel-subtitle {
      margin-top: 4px;

      color: var(--grey);

      font-size: .9rem;
    }


    /* =====================================================
       FORM
    ===================================================== */

    form {
      width: 100%;
      max-width: 100%;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .field,
    .field-row,
    .type-picker,
    .type-options {
      min-width: 0;
    }

    .field {
      width: 100%;
      max-width: 100%;

      display: grid;

      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field-row {
      width: 100%;
      max-width: 100%;

      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);

      gap: 18px;

      grid-column: 1 / -1;
    }

    label {
      color: #4d4945;

      font-size: .67rem;
      font-weight: 900;
      letter-spacing: .1em;

      text-transform: uppercase;
    }

    input,
    textarea,
    select {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      margin: 0;

      padding: 13px 14px;

      border: 1px solid var(--line);
      border-radius: 0;

      outline: none;

      background: var(--cream);
      color: var(--black);

      font-size: 16px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--orange);
    }

    textarea {
      min-height: 100px;

      resize: vertical;
    }

    input[type="date"],
    input[type="time"],
    input[type="url"],
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    input::-webkit-date-and-time-value {
      min-width: 0;

      text-align: left;
    }

    .field-help {
      margin-top: 1px;

      color: #817a72;

      font-size: .72rem;
      line-height: 1.4;
    }


    /* =====================================================
       EVENT TYPE
    ===================================================== */

    .type-picker {
      grid-column: 1 / -1;
    }

    .type-options {
      width: 100%;

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 10px;
    }

    .type-option {
      position: relative;

      min-width: 0;
    }

    .type-option input {
      position: absolute;

      opacity: 0;

      pointer-events: none;
    }

    .type-option label {
      width: 100%;
      max-width: 100%;
      min-width: 0;

      min-height: 74px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      gap: 5px;

      padding: 14px;

      border: 1px solid var(--line);

      background: var(--cream);

      cursor: pointer;

      transition:
        border-color .18s ease,
        background .18s ease;
    }

    .type-option strong {
      font-size: .82rem;
      letter-spacing: .03em;
    }

    .type-option span {
      color: var(--grey);

      font-size: .75rem;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0;

      text-transform: none;
    }

    .type-option input:checked + label {
      border-color: var(--orange);

      background: var(--orange-soft);
    }


    /* =====================================================
       FORM ACTIONS
    ===================================================== */

    .form-actions {
      grid-column: 1 / -1;

      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      margin-top: 5px;
    }

    .status {
      min-height: 22px;

      margin-top: 14px;

      color: var(--grey);

      font-size: .86rem;
    }

    .status.success {
      color: var(--green);
    }

    .status.error {
      color: var(--red);
    }


    /* =====================================================
       EVENTS LIST
    ===================================================== */

    .events-section-title {
      margin: 0 0 16px;

      font-size: 1.35rem;
    }

    .events-list {
      display: grid;

      gap: 12px;
    }

    .event-card {
      width: 100%;

      display: grid;
      grid-template-columns:
        110px
        minmax(0, 1fr)
        auto;

      gap: 24px;

      align-items: center;

      padding: 20px;

      border: 1px solid var(--line);

      background: white;
    }

    .event-card.past {
      opacity: .66;
    }

    .date-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .date-day {
      font-size: 2.6rem;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.05em;
    }

    .date-month {
      margin-top: 5px;

      color: var(--orange);

      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .13em;

      text-transform: uppercase;
    }

    .date-year {
      margin-top: 3px;

      color: var(--grey);

      font-size: .7rem;
    }

    .event-main {
      width: 100%;
      min-width: 0;

      display: grid;

      gap: 7px;
    }

    .event-title-row {
      width: 100%;

      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;
    }

    .event-venue {
      max-width: 100%;

      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.05;

      overflow-wrap: anywhere;
    }

    .badge {
      min-height: 25px;

      display: inline-flex;
      align-items: center;

      padding: 0 9px;

      border-radius: 999px;

      font-size: .57rem;
      font-weight: 900;
      letter-spacing: .09em;

      text-transform: uppercase;
    }

    .badge-public {
      background: #e6f4ea;
      color: #1f6f43;
    }

    .badge-guests {
      background: #fff0dc;
      color: #945000;
    }

    .badge-private {
      background: #eee9ff;
      color: #5f43a4;
    }

    .event-meta {
      width: 100%;

      display: flex;
      flex-wrap: wrap;

      gap: 8px 14px;

      color: var(--grey);

      font-size: .86rem;
    }

    .event-note {
      color: #4b4742;

      font-size: .84rem;
    }

    .event-links {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;
    }

    .event-link {
      color: var(--orange);

      font-size: .76rem;
      font-weight: 800;
    }

    .event-actions {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    .event-actions .btn {
      min-height: 38px;

      padding-inline: 13px;

      font-size: .64rem;
    }

    .empty {
      padding: 30px;

      border: 1px solid var(--line);

      background: white;
      color: var(--grey);
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

      .page {
        width: 100%;
        max-width: 100%;

        padding:
          30px
          clamp(18px, 4vw, 32px)
          75px;
      }

      h1 {
        font-size: clamp(3.2rem, 9vw, 5rem);
      }

      .panel {
        padding: 24px;
      }

      form {
        gap: 16px;
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 760px) {

      .page {
        width: 100%;
        max-width: 100%;

        margin: 0;

        padding:
          24px
          16px
          65px;
      }


      /* HEADER */

      .topbar {
        width: 100%;

        flex-direction: column;
        align-items: stretch;

        gap: 24px;

        margin-bottom: 30px;
      }

      h1 {
        width: 100%;

        font-size: clamp(2.9rem, 12vw, 4rem);
        line-height: .88;

        white-space: nowrap;
      }

      .top-actions {
        width: 100%;

        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 10px;
      }

      .top-actions .btn {
        width: 100%;
        min-width: 0;
        min-height: 46px;

        padding-left: 10px;
        padding-right: 10px;
      }


      /* STATS */

      .stats {
        width: 100%;

        grid-template-columns: 1fr 1fr;

        gap: 10px;

        margin-bottom: 34px;
      }

      .stat-card {
        width: 100%;

        padding: 17px;
      }

      .stat-number {
        font-size: 2rem;
      }


      /* TOOLBAR */

      .toolbar {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: stretch;

        gap: 18px;
      }

      .tabs {
        width: 100%;

        display: grid;
        grid-template-columns: repeat(3, 1fr);

        padding: 4px;
      }

      .tab {
        width: 100%;

        padding-left: 5px;
        padding-right: 5px;

        text-align: center;
      }

      #newShowButton {
        width: auto;

        align-self: flex-start;
      }


      /* PANEL */

      .panel {
        width: 100%;
        max-width: 100%;

        padding: 22px 16px;

        margin-left: 0;
        margin-right: 0;

        overflow: hidden;
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;

        margin-bottom: 26px;
      }


      /* FORM */

      form {
        width: 100%;
        max-width: 100%;

        display: grid;
        grid-template-columns: minmax(0, 1fr);

        gap: 18px;
      }

      .field,
      .field.full,
      .field-row,
      .type-picker,
      .form-actions {
        grid-column: 1 / -1;

        width: 100%;
        max-width: 100%;
      }

      .field-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);

        gap: 18px;
      }

      input,
      textarea,
      select {
        width: 100%;
        max-width: 100%;
        min-width: 0;

        padding: 14px 13px;

        font-size: 16px;
      }


      /* EVENT TYPES */

      .type-options {
        width: 100%;

        display: grid;
        grid-template-columns: minmax(0, 1fr);

        gap: 9px;
      }

      .type-option {
        width: 100%;
      }

      .type-option label {
        width: 100%;

        min-height: 68px;

        padding: 13px;
      }


      /* FORM ACTIONS */

      .form-actions {
        display: grid;
        grid-template-columns: 1fr;

        gap: 9px;
      }

      .form-actions .btn {
        width: 100%;
      }


      /* EVENT CARDS */

      .event-card {
        width: 100%;

        grid-template-columns:
          62px
          minmax(0, 1fr);

        gap: 14px;

        padding: 17px 14px;
      }

      .event-main {
        width: 100%;
      }

      .event-meta {
        width: 100%;

        flex-direction: column;

        gap: 4px;
      }

      .event-actions {
        grid-column: 1 / -1;

        width: 100%;

        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 8px;

        margin-top: 4px;
      }

      .event-actions .btn {
        width: 100%;
      }
    }


    @media (max-width: 390px) {

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: clamp(2.65rem, 11.5vw, 3.3rem);
      }

      .top-actions {
        grid-template-columns: 1fr;
      }

      .panel {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>


<div class="page">


  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="topbar">

    <div>

      <div class="eyebrow">
        Orange May
      </div>

      <h1>
        Admin <span>Panel</span>
      </h1>

    </div>


    <div class="top-actions">

      <a
        href="/"
        class="btn btn-light"
      >
        View website
      </a>

      <button
        id="logoutButton"
        class="btn btn-dark"
        type="button"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- ===================================================
       STATS
  ==================================================== -->

  <section class="stats">

    <div class="stat-card">

      <div class="stat-label">
        Upcoming
      </div>

      <div
        id="upcomingCount"
        class="stat-number"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        Past
      </div>

      <div
        id="pastCount"
        class="stat-number"
      >
        0
      </div>

    </div>

  </section>


  <!-- ===================================================
       TOOLBAR
  ==================================================== -->

  <div class="toolbar">

    <div class="tabs">

      <button
        class="tab active"
        data-filter="upcoming"
      >
        Upcoming
      </button>

      <button
        class="tab"
        data-filter="past"
      >
        Past
      </button>

      <button
        class="tab"
        data-filter="all"
      >
        All
      </button>

    </div>


    <button
      id="newShowButton"
      class="btn btn-primary"
      type="button"
    >
      + Add show
    </button>

  </div>


  <!-- ===================================================
       FORM
  ==================================================== -->

  <section
    id="formPanel"
    class="panel"
  >

    <div class="panel-header">

      <div>

        <h2 id="formTitle">
          Add show
        </h2>

        <div class="panel-subtitle">
          Add a new Orange May date.
        </div>

      </div>

    </div>


    <form id="eventForm">


      <input
        type="hidden"
        id="eventId"
      >


      <!-- DATE -->

      <div class="field">

        <label for="eventDate">
          Date
        </label>

        <input
          id="eventDate"
          type="date"
          required
        >

      </div>


      <!-- VENUE -->

      <div class="field">

        <label for="venue">
          Venue
        </label>

        <input
          id="venue"
          type="text"
          required
        >

      </div>


      <!-- LOCATION -->

      <div class="field full">

        <label for="location">
          Location
        </label>

        <input
          id="location"
          type="text"
          placeholder="Riva del Garda"
          required
        >

      </div>


      <!-- LOCATION URL -->

      <div class="field full">

        <label for="locationUrl">
          Location link
        </label>

        <input
          id="locationUrl"
          type="url"
          placeholder="https://maps.google.com/..."
        >

        <div class="field-help">
          Optional — Google Maps or Apple Maps link to the venue.
        </div>

      </div>


      <!-- TIMES -->

      <div class="field-row">

        <div class="field">

          <label for="startTime">
            Start time
          </label>

          <input
            id="startTime"
            type="time"
          >

        </div>


        <div class="field">

          <label for="endTime">
            End time
          </label>

          <input
            id="endTime"
            type="time"
          >

        </div>

      </div>


      <!-- EVENT TYPE -->

      <div class="type-picker">

        <label>
          Event type
        </label>


        <div class="type-options">


          <div class="type-option">

            <input
              id="typePublic"
              type="radio"
              name="eventType"
              value="PUBLIC"
              checked
            >

            <label for="typePublic">

              <strong>
                Public
              </strong>

              <span>
                Open to everyone.
              </span>

            </label>

          </div>


          <div class="type-option">

            <input
              id="typeGuests"
              type="radio"
              name="eventType"
              value="GUESTS_ONLY"
            >

            <label for="typeGuests">

              <strong>
                Guests only
              </strong>

              <span>
                Visible online, but not open to the public.
              </span>

            </label>

          </div>


          <div class="type-option">

            <input
              id="typePrivate"
              type="radio"
              name="eventType"
              value="PRIVATE"
            >

            <label for="typePrivate">

              <strong>
                Private event
              </strong>

              <span>
                Wedding, private party or private booking.
              </span>

            </label>

          </div>

        </div>

      </div>


      <!-- PUBLIC URL -->

      <div class="field full">

        <label for="publicUrl">
          Event / public link
        </label>

        <input
          id="publicUrl"
          type="url"
          placeholder="https://..."
        >

        <div class="field-help">
          Optional — website, event page, booking page or other public information.
        </div>

      </div>


      <!-- NOTE -->

      <div class="field full">

        <label for="note">
          Note
        </label>

        <textarea
          id="note"
          placeholder="Optional information about the event"
        ></textarea>

      </div>


      <!-- ACTIONS -->

      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save show
        </button>

        <button
          type="button"
          id="cancelEdit"
          class="btn btn-light"
          hidden
        >
          Cancel edit
        </button>

      </div>

    </form>


    <div
      id="status"
      class="status"
      aria-live="polite"
    ></div>

  </section>


  <!-- ===================================================
       EVENTS
  ==================================================== -->

  <section>

    <h2
      id="eventsSectionTitle"
      class="events-section-title"
    >
      Upcoming shows
    </h2>


    <div
      id="eventsList"
      class="events-list"
    >

      <div class="empty">
        Loading...
      </div>

    </div>

  </section>

</div>


<script>

  const form =
    document.getElementById(
      "eventForm"
    );

  const eventsList =
    document.getElementById(
      "eventsList"
    );

  const status =
    document.getElementById(
      "status"
    );

  const cancelEdit =
    document.getElementById(
      "cancelEdit"
    );

  const formTitle =
    document.getElementById(
      "formTitle"
    );

  const upcomingCount =
    document.getElementById(
      "upcomingCount"
    );

  const pastCount =
    document.getElementById(
      "pastCount"
    );

  const eventsSectionTitle =
    document.getElementById(
      "eventsSectionTitle"
    );

  const newShowButton =
    document.getElementById(
      "newShowButton"
    );

  const formPanel =
    document.getElementById(
      "formPanel"
    );


  let allEvents = [];

  let currentFilter =
    "upcoming";


  /* =====================================================
     LOAD EVENTS
  ===================================================== */

  async function loadEvents() {

    try {

      const response =
        await fetch(
          "/api/admin/events"
        );


      if (
        response.status === 401
      ) {

        window.location.href =
          "/login";

        return;
      }


      if (!response.ok) {
        throw new Error();
      }


      allEvents =
        await response.json();


      updateStats();

      renderEvents();


    } catch {

      eventsList.innerHTML =
        `
          <div class="empty">
            Unable to load shows.
          </div>
        `;
    }
  }


  /* =====================================================
     STATS
  ===================================================== */

  function updateStats() {

    const now =
      new Date();


    const upcoming =
      allEvents.filter(
        event =>
          getEventEnd(event) >= now
      );


    const past =
      allEvents.filter(
        event =>
          getEventEnd(event) < now
      );


    upcomingCount.textContent =
      upcoming.length;


    pastCount.textContent =
      past.length;
  }


  /* =====================================================
     RENDER EVENTS
  ===================================================== */

  function renderEvents() {

    const now =
      new Date();


    let events =
      [...allEvents];


    if (
      currentFilter === "upcoming"
    ) {

      events =
        events.filter(
          event =>
            getEventEnd(event) >= now
        );


      eventsSectionTitle.textContent =
        "Upcoming shows";
    }


    if (
      currentFilter === "past"
    ) {

      events =
        events
          .filter(
            event =>
              getEventEnd(event) < now
          )
          .sort(
            (a, b) =>
              getEventEnd(b) -
              getEventEnd(a)
          );


      eventsSectionTitle.textContent =
        "Past shows";
    }


    if (
      currentFilter === "all"
    ) {

      eventsSectionTitle.textContent =
        "All shows";
    }


    if (!events.length) {

      eventsList.innerHTML =
        `
          <div class="empty">
            No shows found.
          </div>
        `;

      return;
    }


    eventsList.innerHTML =
      events
        .map(
          event =>
            createEventCard(
              event,
              getEventEnd(event) < now
            )
        )
        .join("");
  }


  /* =====================================================
     EVENT CARD
  ===================================================== */

  function createEventCard(
    event,
    isPast
  ) {

    const date =
      new Date(
        event.event_date +
        "T12:00:00"
      );


    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    const month =
      date
        .toLocaleString(
          "en",
          {
            month:
              "short"
          }
        )
        .toUpperCase();


    const year =
      date.getFullYear();


    const type =
      event.event_type ||
      "PUBLIC";


    const badge =
      getBadge(type);


    const time =
      event.start_time
        ? event.end_time
          ? `${
              event.start_time
            } – ${
              event.end_time
            }`
          : event.start_time
        : "";


    return `
      <article
        class="
          event-card
          ${
            isPast
              ? "past"
              : ""
          }
        "
      >

        <div class="date-box">

          <span class="date-day">
            ${day}
          </span>

          <span class="date-month">
            ${month}
          </span>

          <span class="date-year">
            ${year}
          </span>

        </div>


        <div class="event-main">

          <div class="event-title-row">

            <div class="event-venue">
              ${
                escapeHtml(
                  event.venue
                )
              }
            </div>

            ${badge}

          </div>


          <div class="event-meta">

            <span>
              ${
                escapeHtml(
                  event.location || ""
                )
              }
            </span>

            ${
              time
                ? `
                    <span>
                      ${
                        escapeHtml(
                          time
                        )
                      }
                    </span>
                  `
                : ""
            }

          </div>


          ${
            event.note
              ? `
                  <div class="event-note">
                    ${
                      escapeHtml(
                        event.note
                      )
                    }
                  </div>
                `
              : ""
          }


          <div class="event-links">

            ${
              event.location_url
                ? `
                    <a
                      href="${
                        escapeAttribute(
                          event.location_url
                        )
                      }"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="event-link"
                    >
                      Directions ↗
                    </a>
                  `
                : ""
            }

            ${
              event.public_url
                ? `
                    <a
                      href="${
                        escapeAttribute(
                          event.public_url
                        )
                      }"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="event-link"
                    >
                      Public link ↗
                    </a>
                  `
                : ""
            }

          </div>

        </div>


        <div class="event-actions">

          <button
            class="btn btn-light"
            type="button"
            onclick="editEvent(${event.id})"
          >
            Edit
          </button>

          <button
            class="btn btn-danger"
            type="button"
            onclick="deleteEvent(${event.id})"
          >
            Delete
          </button>

        </div>

      </article>
    `;
  }


  /* =====================================================
     BADGES
  ===================================================== */

  function getBadge(type) {

    if (
      type === "PRIVATE"
    ) {

      return `
        <span
          class="
            badge
            badge-private
          "
        >
          Private event
        </span>
      `;
    }


    if (
      type === "GUESTS_ONLY"
    ) {

      return `
        <span
          class="
            badge
            badge-guests
          "
        >
          Guests only
        </span>
      `;
    }


    return `
      <span
        class="
          badge
          badge-public
        "
      >
        Public
      </span>
    `;
  }


  /* =====================================================
     EVENT END
  ===================================================== */

  function getEventEnd(event) {

    const endTime =
      event.end_time ||
      event.start_time ||
      "23:59";


    return new Date(
      `${
        event.event_date
      }T${
        endTime
      }:00`
    );
  }


  /* =====================================================
     SAVE EVENT
  ===================================================== */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      clearStatus();


      const id =
        document
          .getElementById(
            "eventId"
          )
          .value;


      const selectedType =
        document.querySelector(
          'input[name="eventType"]:checked'
        )?.value ||
        "PUBLIC";


      const data = {

        event_date:
          document
            .getElementById(
              "eventDate"
            )
            .value,

        venue:
          document
            .getElementById(
              "venue"
            )
            .value,

        location:
          document
            .getElementById(
              "location"
            )
            .value,

        location_url:
          document
            .getElementById(
              "locationUrl"
            )
            .value
            .trim(),

        start_time:
          document
            .getElementById(
              "startTime"
            )
            .value,

        end_time:
          document
            .getElementById(
              "endTime"
            )
            .value,

        event_type:
          selectedType,

        public_url:
          document
            .getElementById(
              "publicUrl"
            )
            .value
            .trim(),

        note:
          document
            .getElementById(
              "note"
            )
            .value
      };


      status.textContent =
        "Saving...";


      try {

        const response =
          await fetch(

            id
              ? `/api/admin/events/${id}`
              : "/api/admin/events",

            {

              method:
                id
                  ? "PUT"
                  : "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  data
                )
            }

          );


        if (
          response.status === 401
        ) {

          window.location.href =
            "/login";

          return;
        }


        if (!response.ok) {

          const result =
            await response
              .json()
              .catch(
                () => ({})
              );


          throw new Error(
            result.error ||
            "Unable to save show"
          );
        }


        status.className =
          "status success";


        status.textContent =
          id
            ? "Show updated successfully."
            : "Show added successfully.";


        resetForm();


        await loadEvents();


      } catch (error) {

        status.className =
          "status error";


        status.textContent =
          error.message;
      }

    }
  );


  /* =====================================================
     EDIT EVENT
  ===================================================== */

  function editEvent(id) {

    const event =
      allEvents.find(
        item =>
          Number(item.id) ===
          Number(id)
      );


    if (!event) {
      return;
    }


    document
      .getElementById(
        "eventId"
      )
      .value =
        event.id;


    document
      .getElementById(
        "eventDate"
      )
      .value =
        event.event_date || "";


    document
      .getElementById(
        "venue"
      )
      .value =
        event.venue || "";


    document
      .getElementById(
        "location"
      )
      .value =
        event.location || "";


    document
      .getElementById(
        "locationUrl"
      )
      .value =
        event.location_url || "";


    document
      .getElementById(
        "startTime"
      )
      .value =
        event.start_time || "";


    document
      .getElementById(
        "endTime"
      )
      .value =
        event.end_time || "";


    document
      .getElementById(
        "publicUrl"
      )
      .value =
        event.public_url || "";


    document
      .getElementById(
        "note"
      )
      .value =
        event.note || "";


    const type =
      event.event_type ||
      "PUBLIC";


    const radio =
      document.querySelector(
        `input[name="eventType"][value="${type}"]`
      );


    if (radio) {
      radio.checked = true;
    }


    formTitle.textContent =
      "Edit show";


    cancelEdit.hidden =
      false;


    formPanel.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }


  /* =====================================================
     DELETE
  ===================================================== */

  async function deleteEvent(id) {

    const event =
      allEvents.find(
        item =>
          Number(item.id) ===
          Number(id)
      );


    const name =
      event?.venue ||
      "this show";


    const confirmed =
      confirm(
        `Delete "${name}"?`
      );


    if (!confirmed) {
      return;
    }


    try {

      const response =
        await fetch(
          `/api/admin/events/${id}`,
          {
            method:
              "DELETE"
          }
        );


      if (
        response.status === 401
      ) {

        window.location.href =
          "/login";

        return;
      }


      if (!response.ok) {
        throw new Error();
      }


      await loadEvents();


    } catch {

      alert(
        "Unable to delete show."
      );
    }
  }


  /* =====================================================
     RESET FORM
  ===================================================== */

  function resetForm() {

    form.reset();


    document
      .getElementById(
        "eventId"
      )
      .value = "";


    document
      .getElementById(
        "typePublic"
      )
      .checked = true;


    formTitle.textContent =
      "Add show";


    cancelEdit.hidden =
      true;
  }


  function clearStatus() {

    status.className =
      "status";


    status.textContent =
      "";
  }


  cancelEdit.addEventListener(
    "click",
    () => {

      resetForm();

      clearStatus();
    }
  );


  /* =====================================================
     ADD SHOW BUTTON
  ===================================================== */

  newShowButton.addEventListener(
    "click",
    () => {

      resetForm();

      clearStatus();


      formPanel.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });


      setTimeout(
        () => {

          document
            .getElementById(
              "eventDate"
            )
            .focus();

        },
        400
      );

    }
  );


  /* =====================================================
     FILTERS
  ===================================================== */

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".tab"
              )
              .forEach(
                item =>
                  item
                    .classList
                    .remove(
                      "active"
                    )
              );


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            renderEvents();

          }
        );

      }
    );


  /* =====================================================
     LOGOUT
  ===================================================== */

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await fetch(
          "/api/auth/logout",
          {
            method:
              "POST"
          }
        );


        window.location.href =
          "/login";
      }
    );


  /* =====================================================
     ESCAPE
  ===================================================== */

  function escapeHtml(
    value = ""
  ) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );
  }


  function escapeAttribute(
    value = ""
  ) {

    return escapeHtml(
      value
    );
  }


  /* =====================================================
     START
  ===================================================== */

  loadEvents();

</script>

</body>
</html>
