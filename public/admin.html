<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orange May Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --orange: #ff6a00;
      --cream: #f5f0e8;
      --black: #11100f;
      --grey: #77716a;
      --line: rgba(17,16,15,.15);
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      width: min(calc(100% - 40px), 1100px);
      margin: 0 auto;
      padding: 50px 0 100px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 55px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5rem);
      line-height: .9;
      letter-spacing: -.06em;
    }

    .orange {
      color: var(--orange);
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-dark {
      background: var(--black);
      color: white;
    }

    .btn-delete {
      background: transparent;
      color: #b00020;
      border: 1px solid #b00020;
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      padding: 28px;
      margin-bottom: 35px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--cream);
      padding: 13px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--orange);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .events-list {
      border-top: 2px solid var(--black);
    }

    .event-row {
      display: grid;
      grid-template-columns: 100px 1.3fr 1fr 120px auto;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }

    .event-date {
      font-weight: 900;
    }

    .venue {
      font-weight: 800;
    }

    .muted {
      color: var(--grey);
      font-size: .9rem;
    }

    .note {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--orange);
      color: white;
      font-size: .62rem;
      font-weight: 800;
    }

    .row-actions {
      display: flex;
      gap: 8px;
    }

    .row-actions button {
      padding: 8px 11px;
      font-size: .72rem;
    }

    .status {
      min-height: 24px;
      margin-top: 15px;
      color: var(--grey);
    }

    @media (max-width: 750px) {
      .page {
        width: calc(100% - 28px);
        padding-top: 28px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      form {
        grid-template-columns: 1fr;
      }

      .field.full,
      .form-actions {
        grid-column: auto;
      }

      .event-row {
        grid-template-columns: 70px 1fr;
        gap: 10px 15px;
      }

      .event-location,
      .event-time,
      .row-actions {
        grid-column: 2;
      }

      .row-actions {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header>
    <div>
      <div>ORANGE MAY</div>
      <h1>
        ADMIN <span class="orange">PANEL</span>
      </h1>
    </div>

    <a href="/" class="btn btn-dark">
      View website
    </a>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
  <a href="/" class="btn btn-dark">
    View website
  </a>

  <button
    id="logoutButton"
    class="btn btn-delete"
    type="button"
  >
    Logout
  </button>
</div>
  </header>


  <section class="panel">

    <h2 id="formTitle">Add show</h2>

    <form id="eventForm">

      <input
        type="hidden"
        id="eventId"
      >

      <div class="field">
        <label for="eventDate">Date</label>
        <input
          id="eventDate"
          type="date"
          required
        >
      </div>

      <div class="field">
        <label for="venue">Venue</label>
        <input
          id="venue"
          type="text"
          required
        >
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input
          id="location"
          type="text"
          required
        >
      </div>

      <div class="field">
        <label for="startTime">Start time</label>
        <input
          id="startTime"
          type="time"
        >
      </div>

      <div class="field">
        <label for="endTime">End time</label>
        <input
          id="endTime"
          type="time"
        >
      </div>

      <div class="field">
        <label for="note">Note</label>
        <input
          id="note"
          type="text"
          placeholder="PRIVATE EVENT / GUESTS ONLY"
        >
      </div>

      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save show
        </button>

        <button
          type="button"
          id="cancelEdit"
          class="btn btn-dark"
          hidden
        >
          Cancel
        </button>

      </div>

    </form>

    <div
      id="status"
      class="status"
    ></div>

  </section>


  <section>

    <h2>Shows</h2>

    <div
      id="eventsList"
      class="events-list"
    >
      Loading...
    </div>

  </section>

</div>


<script>
  const form =
    document.getElementById("eventForm");

  const eventsList =
    document.getElementById("eventsList");

  const status =
    document.getElementById("status");

  const cancelEdit =
    document.getElementById("cancelEdit");

  const formTitle =
    document.getElementById("formTitle");


  async function loadEvents() {
    try {
      const response =
        await fetch("/api/admin/events");

      if (!response.ok) {
        throw new Error();
      }

      const events =
        await response.json();

      if (!events.length) {
        eventsList.innerHTML =
          "<p>No shows found.</p>";
        return;
      }

      eventsList.innerHTML =
        events.map(event => `
          <div class="event-row">

            <div class="event-date">
              ${escapeHtml(event.event_date)}
            </div>

            <div>
              <div class="venue">
                ${escapeHtml(event.venue)}
              </div>

              ${
                event.note
                  ? `<span class="note">${escapeHtml(event.note)}</span>`
                  : ""
              }
            </div>

            <div class="event-location muted">
              ${escapeHtml(event.location)}
            </div>

            <div class="event-time muted">
              ${escapeHtml(event.start_time || "")}
              ${
                event.end_time
                  ? " – " + escapeHtml(event.end_time)
                  : ""
              }
            </div>

            <div class="row-actions">

              <button
                class="btn btn-dark"
                onclick='editEvent(${JSON.stringify(event)})'
              >
                Edit
              </button>

              <button
                class="btn btn-delete"
                onclick="deleteEvent(${event.id})"
              >
                Delete
              </button>

            </div>

          </div>
        `).join("");

    } catch {
      eventsList.innerHTML =
        "<p>Unable to load shows.</p>";
    }
  }


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const id =
        document.getElementById("eventId").value;

      const data = {
        event_date:
          document.getElementById("eventDate").value,

        venue:
          document.getElementById("venue").value,

        location:
          document.getElementById("location").value,

        start_time:
          document.getElementById("startTime").value,

        end_time:
          document.getElementById("endTime").value,

        note:
          document.getElementById("note").value
      };

      status.textContent =
        "Saving...";

      try {
        const response =
          await fetch(
            id
              ? `/api/admin/events/${id}`
              : "/api/admin/events",
            {
              method:
                id ? "PUT" : "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(data)
            }
          );

        if (!response.ok) {
          throw new Error();
        }

        status.textContent =
          "Saved successfully.";

        resetForm();
        await loadEvents();

      } catch {
        status.textContent =
          "Unable to save show.";
      }
    }
  );


  function editEvent(event) {
    document.getElementById("eventId").value =
      event.id;

    document.getElementById("eventDate").value =
      event.event_date || "";

    document.getElementById("venue").value =
      event.venue || "";

    document.getElementById("location").value =
      event.location || "";

    document.getElementById("startTime").value =
      event.start_time || "";

    document.getElementById("endTime").value =
      event.end_time || "";

    document.getElementById("note").value =
      event.note || "";

    formTitle.textContent =
      "Edit show";

    cancelEdit.hidden =
      false;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  async function deleteEvent(id) {
    const confirmed =
      confirm(
        "Are you sure you want to delete this show?"
      );

    if (!confirmed) {
      return;
    }

    try {
      const response =
        await fetch(
          `/api/admin/events/${id}`,
          {
            method: "DELETE"
          }
        );

      if (!response.ok) {
        throw new Error();
      }

      await loadEvents();

    } catch {
      alert(
        "Unable to delete show."
      );
    }
  }


  function resetForm() {
    form.reset();

    document.getElementById("eventId").value =
      "";

    formTitle.textContent =
      "Add show";

    cancelEdit.hidden =
      true;
  }


  cancelEdit.addEventListener(
    "click",
    resetForm
  );


  function escapeHtml(value = "") {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  loadEvents();
  document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async () => {

      await fetch(
        "/api/auth/logout",
        {
          method: "POST"
        }
      );

      window.location.href =
        "/login";
    }
  );
</script>

</body>
</html>
