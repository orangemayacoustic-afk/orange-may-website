<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orange May Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --orange: #ff6a00;
      --cream: #f5f0e8;
      --black: #11100f;
      --grey: #77716a;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at top right,
          rgba(255,106,0,.22),
          transparent 40%
        ),
        var(--black);

      color: white;

      font-family: Arial, Helvetica, sans-serif;
    }

    .login {
      width: min(100%, 430px);
    }

    .brand {
      margin-bottom: 42px;

      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;

      font-size: clamp(3rem, 12vw, 5rem);
      line-height: .85;
      letter-spacing: -.06em;

      text-transform: uppercase;
    }

    h1 span {
      color: var(--orange);
    }

    p {
      margin: 0 0 40px;

      color: rgba(255,255,255,.6);

      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .12em;

      text-transform: uppercase;

      color: rgba(255,255,255,.6);
    }

    input {
      width: 100%;

      padding: 16px 0;

      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.3);
      border-radius: 0;

      background: transparent;
      color: white;

      outline: none;

      font-size: 16px;
    }

    input:focus {
      border-color: var(--orange);
    }

    button {
      min-height: 52px;

      margin-top: 12px;

      border: 0;
      border-radius: 999px;

      background: var(--orange);
      color: white;

      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        transform .2s ease,
        opacity .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .6;
      cursor: default;
      transform: none;
    }

    .status {
      min-height: 22px;

      margin-top: 4px;

      color: rgba(255,255,255,.72);

      font-size: .85rem;
    }

    .status.error {
      color: #ff8b8b;
    }

    .back {
      display: inline-block;

      margin-top: 34px;

      color: rgba(255,255,255,.55);

      font-size: .75rem;
      font-weight: 800;

      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 500px) {
      body {
        align-items: flex-start;

        padding:
          max(35px, env(safe-area-inset-top))
          20px
          30px;
      }

      .login {
        width: 100%;
      }

      .brand {
        margin-bottom: 55px;
      }

      h1 {
        font-size: clamp(3.5rem, 17vw, 5rem);
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="brand">
      Orange May
    </div>

    <h1>
      Admin<br>
      <span>Login</span>
    </h1>

    <p>
      Enter the admin password to manage upcoming shows.
    </p>

    <form id="loginForm">

      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        >

      </div>

      <button
        id="loginButton"
        type="submit"
      >
        Log in →
      </button>

      <div
        id="status"
        class="status"
        aria-live="polite"
      ></div>

    </form>

    <a
      href="/"
      class="back"
    >
      ← Back to website
    </a>

  </main>


  <script>
    const form =
      document.getElementById("loginForm");

    const status =
      document.getElementById("status");

    const loginButton =
      document.getElementById("loginButton");

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const password =
          document.getElementById("password").value;

        status.classList.remove("error");
        status.textContent =
          "Checking...";

        loginButton.disabled =
          true;

        try {
          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    password
                  })
              }
            );

          if (!response.ok) {
            status.classList.add("error");
            status.textContent =
              "Incorrect password.";

            loginButton.disabled =
              false;

            return;
          }

          status.textContent =
            "Login successful...";

          window.location.href =
            "/admin";

        } catch (error) {
          console.error(error);

          status.classList.add("error");
          status.textContent =
            "Unable to log in. Please try again.";

          loginButton.disabled =
            false;
        }

      }
    );
  </script>

</body>
</html>
